<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js 基础交互 - threeproject</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 30px;
            pointer-events: none;
            user-select: none;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">Three.js · 旋转立方体 + 轨道控制</div>

    <!-- importmap 映射配置 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./js/three.module.js",
            "three/addons/": "./js/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        // OrbitControls 直接放在 js/ 根目录，对应路径为 js/OrbitControls.js
        import { OrbitControls } from 'three/addons/OrbitControls.js';

        // ===== 四大件 =====
        // 1. 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // 2. 相机
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(4, 3, 5);
        camera.lookAt(0, 0, 0);

        // 3. 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);
        controls.update();

        // ===== 场景内容 =====
        // 立方体
        const cubeGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const cubeMat = new THREE.MeshStandardMaterial({
            color: 0xff6600,
            roughness: 0.3,
            metalness: 0.1,
            emissive: 0x331100,
        });
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        scene.add(cube);

        // 小球体
        const sphereGeo = new THREE.SphereGeometry(0.35, 24, 16);
        const sphereMat = new THREE.MeshStandardMaterial({
            color: 0x33ccff,
            roughness: 0.2,
            metalness: 0.7,
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(sphere);

        // 地面网格
        const grid = new THREE.GridHelper(8, 12, 0x88aaff, 0x446688);
        grid.position.y = -0.8;
        scene.add(grid);

        // 灯光
        scene.add(new THREE.AmbientLight(0x404060));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xffaa88, 0.6);
        fillLight.position.set(-3, 1, 2);
        scene.add(fillLight);

        // ===== 窗口自适应 =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== 主循环 =====
        function animate() {
            requestAnimationFrame(animate);

            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;

            const t = Date.now() * 0.001;
            sphere.position.x = 1.8 * Math.sin(t * 0.4);
            sphere.position.z = 1.8 * Math.cos(t * 0.4);
            sphere.position.y = 0.6 + 0.4 * Math.sin(t * 0.6);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        console.log('Three.js 场景已启动！拖动鼠标旋转，滚轮缩放。');
    </script>
</body>
</html>
